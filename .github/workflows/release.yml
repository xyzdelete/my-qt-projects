  publish-release:
    name: publish-release
    needs:
      - host-x64-windows-target-x64-windows-static-release
      - host-arm64-windows-target-arm64-windows-static-release
      - host-arm64-osx-target-arm64-osx-release
      - host-arm64-osx-target-arm64-ios-simulator-release
      - host-arm64-osx-target-arm64-ios-release
      - host-x64-linux-target-x64-linux-release
      - host-arm64-linux-target-arm64-linux-release
      - host-x64-windows-target-arm64-android-release
      - host-x64-windows-target-wasm32-emscripten-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -type f -exec mv -t release-files {} +
          ls -hal release-files
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          fail_on_unmatched_files: true
          generate_release_notes: true