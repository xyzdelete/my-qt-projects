name: release

on:
  push:
    tags:
      - '*-v*-release'

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BASELINE: eb2d3a3279fd019cb7733072d86900d0ad2a1aef

jobs:
  host-x64-windows-target-x64-windows-static-release:
    name: host-x64-windows-target-x64-windows-static-release
    runs-on: windows-latest
    env:
      BUILD_ROOT: D:/build
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clean build directory
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUILD_ROOT)) { throw 'The configured build directory path is empty' }
          if (Test-Path -LiteralPath $env:BUILD_ROOT) {
            Remove-Item -LiteralPath $env:BUILD_ROOT -Recurse -Force -ErrorAction Stop
          }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report CMake version
        run: cmake --version
      - name: Report CPack version
        run: cpack --version
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Report MSVC compiler
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Output "MSVC compiler: $($compiler.Source)"
          & $compiler.Source 2>&1 | Select-Object -First 2
      - name: Install NSIS and verify packaging tools
        run: |
          choco --version
          choco install nsis --no-progress --yes
          $nsisPath = "${env:ProgramFiles(x86)}/NSIS"
          if (-not (Test-Path "$nsisPath/makensis.exe")) { throw "NSIS was not found at $nsisPath" }
          $env:Path = "$nsisPath;$env:Path"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          makensis /VERSION
      - name: Install vcpkg
        env:
          VCPKG_ROOT: D:/vcpkg
          VCPKG_INSTALLED_ROOT: D:/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: D:/vcpkg-buildtrees
        run: |
          foreach ($directory in @($env:VCPKG_ROOT, $env:VCPKG_INSTALLED_ROOT, $env:VCPKG_BUILDTREES_ROOT)) {
            if ([string]::IsNullOrWhiteSpace($directory)) { throw 'A configured vcpkg directory path is empty' }
            if (Test-Path -LiteralPath $directory) {
              Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction Stop
            }
          }
          # Short root-level path avoids MAX_PATH (260) failures deep in qtdeclarative's nested sources
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone vcpkg into $env:VCPKG_ROOT" }
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) { throw "Failed to check out vcpkg baseline $env:VCPKG_BASELINE" }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Failed to bootstrap vcpkg" }
          @(
            "VCPKG_ROOT=$env:VCPKG_ROOT"
            "VCPKG_INSTALLED_ROOT=$env:VCPKG_INSTALLED_ROOT"
            "VCPKG_BUILDTREES_ROOT=$env:VCPKG_BUILDTREES_ROOT"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:VCPKG_ROOT/vcpkg.exe" version
      - name: Configure and build
        run: |
          cmake --preset host-x64-windows-target-x64-windows-static-release
          cmake --build --preset host-x64-windows-target-x64-windows-static-release-build --parallel
      - name: Package NSIS and ZIP
        run: |
          cmake --install $env:BUILD_ROOT --config Release
          cpack --config "$env:BUILD_ROOT/CPackConfig.cmake" -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-x64-windows-static-release
          path: |
            ${{ env.BUILD_ROOT }}/*.zip
            ${{ env.BUILD_ROOT }}/*.exe
          if-no-files-found: error

  host-arm64-windows-target-arm64-windows-static-release:
    name: host-arm64-windows-target-arm64-windows-static-release
    runs-on: windows-11-arm
    env:
      BUILD_ROOT: C:/build
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clean build directory
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUILD_ROOT)) { throw 'The configured build directory path is empty' }
          if (Test-Path -LiteralPath $env:BUILD_ROOT) {
            Remove-Item -LiteralPath $env:BUILD_ROOT -Recurse -Force -ErrorAction Stop
          }
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report CMake version
        run: cmake --version
      - name: Report CPack version
        run: cpack --version
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Report MSVC compiler
        run: |
          $compiler = Get-Command cl.exe -ErrorAction Stop
          Write-Output "MSVC compiler: $($compiler.Source)"
          & $compiler.Source 2>&1 | Select-Object -First 2
      - name: Install NSIS and verify packaging tools
        run: |
          choco --version
          choco install nsis --no-progress --yes
          $nsisPath = "${env:ProgramFiles(x86)}/NSIS"
          if (-not (Test-Path "$nsisPath/makensis.exe")) { throw "NSIS was not found at $nsisPath" }
          $env:Path = "$nsisPath;$env:Path"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          makensis /VERSION
      - name: Install vcpkg
        env:
          VCPKG_ROOT: C:/vcpkg
          VCPKG_INSTALLED_ROOT: C:/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: C:/vcpkg-buildtrees
        run: |
          foreach ($directory in @($env:VCPKG_ROOT, $env:VCPKG_INSTALLED_ROOT, $env:VCPKG_BUILDTREES_ROOT)) {
            if ([string]::IsNullOrWhiteSpace($directory)) { throw 'A configured vcpkg directory path is empty' }
            if (Test-Path -LiteralPath $directory) {
              Remove-Item -LiteralPath $directory -Recurse -Force -ErrorAction Stop
            }
          }
          # Short root-level path avoids MAX_PATH (260) failures deep in qtdeclarative's nested sources
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone vcpkg into $env:VCPKG_ROOT" }
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_BASELINE
          if ($LASTEXITCODE -ne 0) { throw "Failed to check out vcpkg baseline $env:VCPKG_BASELINE" }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "Failed to bootstrap vcpkg" }
          @(
            "VCPKG_ROOT=$env:VCPKG_ROOT"
            "VCPKG_INSTALLED_ROOT=$env:VCPKG_INSTALLED_ROOT"
            "VCPKG_BUILDTREES_ROOT=$env:VCPKG_BUILDTREES_ROOT"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:VCPKG_ROOT/vcpkg.exe" version
      - name: Configure and build
        run: |
          cmake --preset host-arm64-windows-target-arm64-windows-static-release
          cmake --build --preset host-arm64-windows-target-arm64-windows-static-release-build --parallel
      - name: Package NSIS and ZIP
        run: |
          cmake --install $env:BUILD_ROOT --config Release
          cpack --config "$env:BUILD_ROOT/CPackConfig.cmake" -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-windows-static-release
          path: |
            ${{ env.BUILD_ROOT }}/*.zip
            ${{ env.BUILD_ROOT }}/*.exe
          if-no-files-found: error

  host-arm64-osx-target-arm64-osx-release:
    name: host-arm64-osx-target-arm64-osx-release
    runs-on: macos-latest
    env:
      BUILD_ROOT: ${{ github.workspace }}/build
    steps:
      - name: Clean build directory
        run: |
          if [[ -z "$BUILD_ROOT" ]]; then
            echo "The configured build directory path is empty." >&2
            exit 1
          fi
          if [[ -e "$BUILD_ROOT" || -L "$BUILD_ROOT" ]]; then
            rm -rf -- "$BUILD_ROOT"
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report CMake version
        run: cmake --version
      - name: Report CPack version
        run: cpack --version
      - name: Report Apple Clang compiler
        run: |
          clang --version
          clang++ --version
      - name: Install macOS build prerequisites
        run: |
          brew install autoconf autoconf-archive automake libtool ninja
          libtool_bin="$(brew --prefix libtool)/libexec/gnubin"
          export PATH="$libtool_bin:$PATH"
          echo "$libtool_bin" >> "$GITHUB_PATH"
          autoconf --version
          automake --version
          libtoolize --version
      - name: Install vcpkg
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ github.workspace }}/vcpkg-buildtrees
        run: |
          for directory in "$VCPKG_ROOT" "$VCPKG_INSTALLED_ROOT" "$VCPKG_BUILDTREES_ROOT"; do
            if [[ -z "$directory" ]]; then
              echo "A configured vcpkg directory path is empty." >&2
              exit 1
            fi
            if [[ -e "$directory" || -L "$directory" ]]; then
              rm -rf -- "$directory"
            fi
          done
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED_ROOT=$VCPKG_INSTALLED_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_BUILDTREES_ROOT=$VCPKG_BUILDTREES_ROOT" >> "$GITHUB_ENV"
          "$VCPKG_ROOT/vcpkg" version
      - name: Configure and build
        run: |
          cmake --preset host-arm64-osx-target-arm64-osx-release
          cmake --build --preset host-arm64-osx-target-arm64-osx-release-build --parallel
      - name: Package DragNDrop and TGZ
        run: |
          cpack --config "$BUILD_ROOT/CPackConfig.cmake" -C Release
      - name: Sign macOS app and rebuild DMG
        env:
          APPLE_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_MACOS_SIGNING_IDENTITY: ${{ secrets.APPLE_MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          tgz=$(find "$BUILD_ROOT" -maxdepth 1 -type f -name "*.tar.gz" -print -quit)
          test -f "$tgz"
          echo "Found tarball: $tgz"

          dmg=$(find "$BUILD_ROOT" -maxdepth 1 -type f -name "*.dmg" -print -quit)
          test -f "$dmg"
          echo "Found dmg: $dmg"
          dmg_name=$(basename "$dmg")
          volume_name="${dmg_name%.dmg}"

          extract_dir="$RUNNER_TEMP/macos-package-extract"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          tar -xzf "$tgz" -C "$extract_dir"

          app=$(find "$extract_dir" -type d -name "*.app" -print -quit)
          test -d "$app"
          echo "Found app bundle: $app"

          # Directory that actually contains the .app (may be $extract_dir itself,
          # or a wrapper folder CPack created, e.g. MyApp-1.0.0-Darwin/)
          dmg_root="$(dirname "$app")"
          echo "DMG/package root: $dmg_root"

          if [[ -z "${APPLE_MACOS_CERTIFICATE_P12_BASE64:-}" || -z "${APPLE_CERTIFICATE_PASSWORD:-}" || -z "${APPLE_MACOS_SIGNING_IDENTITY:-}" ]]; then
            echo "Apple macOS signing secrets are incomplete; leaving the app unsigned."
            exit 0
          fi

          certificate="$RUNNER_TEMP/macos-signing.p12"
          keychain="$RUNNER_TEMP/macos-signing.keychain-db"
          printf '%s' "$APPLE_MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

          codesign --deep --force --verbose --options runtime --timestamp \
            --sign "$APPLE_MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # Re-create the TGZ, preserving the full original extracted layout
          # (whatever CPack originally put alongside the .app, wrapper folder included)
          rm -f "$tgz"
          tar -czf "$tgz" -C "$extract_dir" .

          # Re-create the DMG from the directory that actually contains the .app,
          # so the DMG root matches CPack's original layout instead of assuming one
          rm -f "$dmg"
          hdiutil create -volname "$volume_name" -srcfolder "$dmg_root" -ov -format UDZO "$dmg"
      - name: Optionally notarize macOS DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          APPLE_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_MACOS_SIGNING_IDENTITY: ${{ secrets.APPLE_MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_NOTARY_KEY_ID:-}" || -z "${APPLE_NOTARY_ISSUER_ID:-}" || -z "${APPLE_NOTARY_PRIVATE_KEY_BASE64:-}" || -z "${APPLE_MACOS_CERTIFICATE_P12_BASE64:-}" || -z "${APPLE_CERTIFICATE_PASSWORD:-}" || -z "${APPLE_MACOS_SIGNING_IDENTITY:-}" ]]; then
            echo "Apple signing or notarization secrets are incomplete; leaving the DMG unstapled."
            exit 0
          fi
          key="$RUNNER_TEMP/apple-notary-key.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
          dmg="$(find "$BUILD_ROOT" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No macOS DMG was produced for notarization." >&2
            exit 1
          fi
          xcrun notarytool submit "$dmg" --key "$key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-osx-release
          path: |
            ${{ env.BUILD_ROOT }}/*.dmg
            ${{ env.BUILD_ROOT }}/*.tar.gz
          if-no-files-found: error

  host-arm64-osx-target-arm64-ios-simulator-release:
    name: host-arm64-osx-target-arm64-ios-simulator-release
    runs-on: macos-latest
    env:
      BUILD_ROOT: ${{ github.workspace }}/build
    steps:
      - name: Clean build directory
        run: |
          if [[ -z "$BUILD_ROOT" ]]; then
            echo "The configured build directory path is empty." >&2
            exit 1
          fi
          if [[ -e "$BUILD_ROOT" || -L "$BUILD_ROOT" ]]; then
            rm -rf -- "$BUILD_ROOT"
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report Apple SDK and compiler
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          clang --version
          clang++ --version
      - name: Install iOS build prerequisites
        run: |
          brew install autoconf autoconf-archive automake libtool ninja
          libtool_bin="$(brew --prefix libtool)/libexec/gnubin"
          export PATH="$libtool_bin:$PATH"
          echo "$libtool_bin" >> "$GITHUB_PATH"
          autoconf --version
          automake --version
          libtoolize --version
      - name: Install vcpkg
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ github.workspace }}/vcpkg-buildtrees
        run: |
          for directory in "$VCPKG_ROOT" "$VCPKG_INSTALLED_ROOT" "$VCPKG_BUILDTREES_ROOT"; do
            if [[ -z "$directory" ]]; then
              echo "A configured vcpkg directory path is empty." >&2
              exit 1
            fi
            if [[ -e "$directory" || -L "$directory" ]]; then
              rm -rf -- "$directory"
            fi
          done
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED_ROOT=$VCPKG_INSTALLED_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_BUILDTREES_ROOT=$VCPKG_BUILDTREES_ROOT" >> "$GITHUB_ENV"
          "$VCPKG_ROOT/vcpkg" version
      - name: Configure and build unsigned simulator app
        run: |
          cmake --preset host-arm64-osx-target-arm64-ios-simulator-release
          cmake --build --preset host-arm64-osx-target-arm64-ios-simulator-release-build --parallel
      - name: Package simulator app
        run: |
          cmake --install "$BUILD_ROOT" --config Release
          app=$(find "$BUILD_ROOT/install" -type d -name "*.app" -print -quit)
          echo "Found app bundle: $app"
          test -d "$app"
          zip_path="$BUILD_ROOT/${{ github.ref_name }}-arm64-ios-simulator-release.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"
          echo "Created zip: $zip_path"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-ios-simulator-release
          path: ${{ env.BUILD_ROOT }}/${{ github.ref_name }}-arm64-ios-simulator-release.zip
          if-no-files-found: error

  host-arm64-osx-target-arm64-ios-release:
    name: host-arm64-osx-target-arm64-ios-release
    runs-on: macos-latest
    env:
      BUILD_ROOT: ${{ github.workspace }}/build
    steps:
      - name: Clean build directory
        run: |
          if [[ -z "$BUILD_ROOT" ]]; then
            echo "The configured build directory path is empty." >&2
            exit 1
          fi
          if [[ -e "$BUILD_ROOT" || -L "$BUILD_ROOT" ]]; then
            rm -rf -- "$BUILD_ROOT"
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: lukka/get-cmake@latest
      - name: Report iOS SDK and compiler
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version
          clang++ --version
      - name: Install iOS build prerequisites
        run: |
          brew install autoconf autoconf-archive automake libtool ninja
          libtool_bin="$(brew --prefix libtool)/libexec/gnubin"
          export PATH="$libtool_bin:$PATH"
          echo "$libtool_bin" >> "$GITHUB_PATH"
          autoconf --version
          automake --version
          libtoolize --version
      - name: Install vcpkg
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_INSTALLED_ROOT: ${{ github.workspace }}/vcpkg-installed
          VCPKG_BUILDTREES_ROOT: ${{ github.workspace }}/vcpkg-buildtrees
        run: |
          for directory in "$VCPKG_ROOT" "$VCPKG_INSTALLED_ROOT" "$VCPKG_BUILDTREES_ROOT"; do
            if [[ -z "$directory" ]]; then
              echo "A configured vcpkg directory path is empty." >&2
              exit 1
            fi
            if [[ -e "$directory" || -L "$directory" ]]; then
              rm -rf -- "$directory"
            fi
          done
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_BASELINE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLED_ROOT=$VCPKG_INSTALLED_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_BUILDTREES_ROOT=$VCPKG_BUILDTREES_ROOT" >> "$GITHUB_ENV"
          "$VCPKG_ROOT/vcpkg" version
      - name: Configure Xcode device project
        run: cmake --preset host-arm64-osx-target-arm64-ios-release
      - name: Archive device app and optionally export IPA
        env:
          APPLE_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_IOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_IOS_SIGNING_IDENTITY: ${{ secrets.APPLE_IOS_SIGNING_IDENTITY }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_IOS_EXPORT_METHOD: ${{ secrets.APPLE_IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          archive="$BUILD_ROOT/${{ github.ref_name }}-arm64-ios-release.xcarchive"
          certificate="$RUNNER_TEMP/ios-signing.p12"
          keychain="$RUNNER_TEMP/ios-signing.keychain-db"
          profile="$RUNNER_TEMP/ios-profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/ios-profile.plist"
          signing_enabled=false

          if [[ -n "${APPLE_IOS_CERTIFICATE_P12_BASE64:-}" && -n "${APPLE_CERTIFICATE_PASSWORD:-}" && -n "${APPLE_IOS_SIGNING_IDENTITY:-}" && -n "${APPLE_DEVELOPMENT_TEAM:-}" && -n "${APPLE_IOS_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            signing_enabled=true
            printf '%s' "$APPLE_IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
            printf '%s' "$APPLE_IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
            security create-keychain -p "" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "" "$keychain"
            security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security list-keychains -d user -s "$keychain"
            security default-keychain -s "$keychain"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            security cms -D -i "$profile" -o "$profile_plist"
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
            profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          else
            echo "iOS signing secrets are incomplete; creating an unsigned device archive."
          fi

          xcode_project=$(find "$BUILD_ROOT" -maxdepth 1 -type d -name "*.xcodeproj" -print -quit)
          test -d "$xcode_project"
          echo "Found Xcode project: $xcode_project"

          app_name="${GITHUB_REF_NAME%%-*}"
          echo "app_name=${app_name}"

          xcode_list_json="$(xcodebuild -project "$xcode_project" -list -json)"
          IFS=$'\n' xcode_schemes=($(printf '%s' "$xcode_list_json" | python3 -c \
            'import json, sys; print("\n".join(json.load(sys.stdin).get("project", {}).get("schemes", [])))'))
          if [[ ${#xcode_schemes[@]} -eq 0 ]]; then
            echo "No Xcode schemes found in $xcode_project." >&2
            exit 1
          fi

          xcode_scheme=""
          for s in "${xcode_schemes[@]}"; do
            if [[ "$s" == "$app_name" ]]; then
              xcode_scheme="$s"
              break
            fi
          done

          if [[ -z "$xcode_scheme" ]]; then
            echo "Could not find a scheme matching '$app_name' in $xcode_project. Available schemes:" >&2
            printf '%s\n' "${xcode_schemes[@]}" >&2
            exit 1
          fi

          echo "Using Xcode project: $xcode_project"
          echo "Using Xcode scheme: $xcode_scheme"
          xcodebuild_args=(
            -project "$xcode_project"
            -scheme "$xcode_scheme"
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -archivePath "$archive"
          )
          if [[ "$signing_enabled" == true ]]; then
            xcodebuild_args+=(
              DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM"
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="$APPLE_IOS_SIGNING_IDENTITY"
              PROVISIONING_PROFILE_SPECIFIER="$profile_name"
            )
          else
            xcodebuild_args+=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi
          xcodebuild "${xcodebuild_args[@]}" archive

          mkdir -p "$BUILD_ROOT/release-artifacts"
          ditto -c -k --sequesterRsrc --keepParent "$archive" \
            "$BUILD_ROOT/release-artifacts/${{ github.ref_name }}-arm64-ios-release.xcarchive.zip"

          if [[ "$signing_enabled" == true ]]; then
            export_options="$RUNNER_TEMP/ios-export-options.plist"
            export_method="${APPLE_IOS_EXPORT_METHOD:-development}"
            bundle_identifier="com.github.xyzdelete.$app_name"
            echo "bundle_identifier=${bundle_identifier}"
            cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$export_method</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$bundle_identifier</key>
              <string>$profile_name</string>
            </dict>
          </dict>
          </plist>
          EOF
            xcodebuild -exportArchive -archivePath "$archive" \
              -exportOptionsPlist "$export_options" \
              -exportPath "$BUILD_ROOT/release-artifacts"
            ipa=$(find "$BUILD_ROOT/release-artifacts" -maxdepth 1 -type f -name "*.ipa" -print -quit)
            test -f "$ipa"
            echo "Found ipa: $ipa"
            mv "$ipa" "$BUILD_ROOT/release-artifacts/${{ github.ref_name }}-arm64-ios-release.ipa"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}-arm64-ios-release
          path: ${{ env.BUILD_ROOT }}/release-artifacts/*
          if-no-files-found: error

  host-x64-linux-target-x64-linux-release:
    name: host-x64-linux-target-x64-linux-release
    runs-on: ubuntu-26.04
    env:
      BUILD_ROOT: ${{ github.workspace }}/build
    steps:
      - name: Clean build directory
        run: |
          if [[ -z "$BUILD_ROOT" ]]; then
            echo "The configured build directory path is empty." >&2
            exit 1
          fi
          if [[ -e "$BUILD_ROOT" || -L "$BUILD_ROOT" ]]; then
            rm -rf -- "$BUILD_ROOT"
          fi
      - uses: actions/checkout@v7
